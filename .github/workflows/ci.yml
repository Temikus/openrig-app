name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Xcode 27 preview image: Xcode 26.6 crashes compiling the app (Swift 6.3.3 IRGen).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install just xcodegen
      - name: Use the runner's default Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
      - run: just lint
      # No rig daemon on the runner: live-daemon tests skip themselves.
      - run: just test
      # SwiftTerm's build-info plugin needs approval; a runner can't click "Trust & Enable" in Xcode.
      # Locally it is trusted once in Xcode instead.
      - run: just build -skipPackagePluginValidation
