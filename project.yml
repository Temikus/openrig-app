# XcodeGen spec. `just gen` writes OpenRig.xcodeproj (not committed).
name: OpenRig
options:
  bundleIdPrefix: dev.openrig
  deploymentTarget:
    macOS: "27.0"
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  OpenRigKit:
    path: OpenRigKit
  # The app imports SwiftTerm's view directly; same pin as OpenRigKit/Package.swift.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.99.2
targets:
  OpenRig:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["AppIcon.icon", "AppIconCanary.icon"]
      # An Icon Composer bundle: one resource, not a folder of loose files.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      # `just install` builds OpenRig Canary with this one.
      - path: App/AppIconCanary.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: OpenRigKit
        product: RigModel
      - package: OpenRigKit
        product: RigClient
      - package: OpenRigKit
        product: RigDomain
      - package: OpenRigKit
        product: RigCanvasLayout
      - package: OpenRigKit
        product: RigTerminal
      - package: SwiftTerm
    info:
      path: App/Info.plist
      properties:
        # OPENRIG_* are set only by `just install`, which builds OpenRig Canary.
        CFBundleDisplayName: $(OPENRIG_APP_NAME:default=OpenRig)
        CFBundleName: $(OPENRIG_APP_NAME:default=OpenRig)
        # XcodeGen otherwise writes a literal 1.0 (1), ignoring the build settings below.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "dev.openrig.OpenRig$(OPENRIG_ID_SUFFIX:default=)"
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: "$(OPENRIG_ICON:default=AppIcon)"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        # Sandbox stays off: the app runs `rig` and `tmux` and reads ~/.openrig.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        # Ad-hoc unless scripts/dist.sh passes these. Overriding CODE_SIGN_IDENTITY on the
        # xcodebuild command line breaks SwiftTerm's auto-signed build plugin.
        CODE_SIGN_IDENTITY: "$(OPENRIG_SIGN_IDENTITY:default=-)"
        DEVELOPMENT_TEAM: "$(OPENRIG_TEAM:default=)"
  # The iPhone remote. It links only the kit's cross-platform libraries.
  OpenRigRemote:
    type: application
    platform: iOS
    sources:
      - path: Remote
      # The Mac app's Icon Composer bundle, shared rather than copied.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: OpenRigKit
        product: RigModel
      - package: OpenRigKit
        product: RigClient
      - package: OpenRigKit
        product: RigDomain
    info:
      path: Remote/Info.plist
      properties:
        CFBundleDisplayName: OpenRig
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: The camera reads the pairing code that OpenRig shows on your Mac.
        # The relay link opens a connection to the Mac's home-network address, which needs Local Network access.
        NSLocalNetworkUsageDescription: OpenRig connects to your Mac on this Wi-Fi to show what your seats ask you.
        # Pairing links: openrig-remote://pair?… (RigModel's PairingCode).
        CFBundleURLTypes:
          - CFBundleURLName: dev.openrig.Remote.pair
            CFBundleURLSchemes: [openrig-remote]
        # The daemon serves plain HTTP. Allowed: MagicDNS names (the phone sends plain HTTP to no tailnet IP,
        # RigClient's plainHTTPClient), and loopback for the simulator, which reaches the Mac's daemon there.
        # Every other host keeps full ATS. Wi-Fi needs no entry: the relay link is TLS over NWConnection,
        # which ATS doesn't govern.
        NSAppTransportSecurity:
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openrig.Remote
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set to install on a phone; simulator builds need no team.
        DEVELOPMENT_TEAM: "$(OPENRIG_TEAM:default=)"
schemes:
  OpenRig:
    build:
      targets:
        OpenRig: all
    run:
      config: Debug
  OpenRigRemote:
    build:
      targets:
        OpenRigRemote: all
    run:
      config: Debug
